[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "kuberich"
version = "0.0.1.dev0"
description = "A Kubernetes terminal UI built with Python and Textual"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Carlos Herrera", email = "carloshm91@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.13.3,<4",
    "aiohttp-socks>=0.12,<0.13",
    "kubernetes-asyncio>=36.1.0,<37",
    "platformdirs>=4.12.3,<5",
    "pyte==0.8.2",
    "pyyaml>=6.0.3,<7",
    "regex>=2026.9.29,<2027",
    "textual>=8.2.8,<9",
]

[project.scripts]
kuberich = "kuberich.cli:main"
kubetrol = "kuberich.cli:main"

[project.urls]
Homepage = "https://github.com/carloshm91/kuberich"
Repository = "https://github.com/carloshm91/kuberich"
Issues = "https://github.com/carloshm91/kuberich/issues"
Changelog = "https://github.com/carloshm91/kuberich/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "build>=1.6.1,<2",
    "cryptography>=50.0.2,<51",
    "cyclonedx-bom>=7.5.0,<8",
    "diff-cover>=10.6.0,<11",
    "markdown-it-py>=4.2.0,<5",
    "mypy>=2.4.0,<3",
    "pip-audit>=2.10.1,<3",
    "pipx>=1.17.11,<2",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.10,<0.17",
    "twine>=7.0.0,<8",
    "types-pyyaml>=6.0.12,<7",
    "types-regex>=2026.9.29.20261005,<2027",
]
standalone = [
    "pyinstaller==6.22.3",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
include = [
    "/src/kuberich/**/*.py",
    "/src/kuberich/**/*.tcss",
    "/src/kuberich/py.typed",
]
exclude = ["**/__pycache__/**", "*.pyc", "*.pyo"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/kuberich/**/*.py",
    "/src/kuberich/**/*.tcss",
    "/src/kuberich/py.typed",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
]
exclude = ["**/__pycache__/**", "*.pyc", "*.pyo"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/kuberich"]
mypy_path = ["scripts/typing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["kuberich"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2
include_namespace_packages = true
# Every production decision stays in the denominator, including no-cover pragmas.
exclude_lines = []
partial_branches = []

[tool.coverage.json]
show_contexts = true

[tool.kuberich.coverage]
# Extend this reviewed list when deterministic security/state decisions are added.
critical_modules = [
    "src/kuberich/cli.py",
    "src/kuberich/__main__.py",
    "src/kuberich/runtime.py",
    "src/kuberich/config/schema.py",
    "src/kuberich/diagnostics/redaction.py",
    "src/kuberich/security/controls.py",
    "src/kuberich/security/presentation.py",
    "src/kuberich/security/arguments.py",
    "src/kuberich/domain/targets.py",
    "src/kuberich/domain/processes.py",
    "src/kuberich/domain/port_forwards.py",
    "src/kuberich/domain/mutations.py",
    "src/kuberich/domain/editing.py",
    "src/kuberich/domain/workloads.py",
    "src/kuberich/domain/operations.py",
    "src/kuberich/domain/shell.py",
    "src/kuberich/domain/attach.py",
    "src/kuberich/domain/transfers.py",
    "src/kuberich/domain/terminal.py",
    "src/kuberich/config/launch.py",
    "src/kuberich/services/access.py",
    "src/kuberich/services/commands.py",
    "src/kuberich/config/catalog.py",
    "src/kuberich/domain/connections.py",
    "src/kuberich/domain/resources.py",
    "src/kuberich/domain/tables.py",
    "src/kuberich/domain/custom.py",
    "src/kuberich/domain/watches.py",
    "src/kuberich/domain/views.py",
    "src/kuberich/domain/pods.py",
    "src/kuberich/domain/registry.py",
    "src/kuberich/domain/namespaces.py",
    "src/kuberich/domain/containers.py",
    "src/kuberich/domain/connection_overrides.py",
    "src/kuberich/domain/credential_helpers.py",
    "src/kuberich/domain/exec_credentials.py",
    "src/kuberich/domain/proxies.py",
    "src/kuberich/domain/navigation.py",
    "src/kuberich/domain/inspection.py",
    "src/kuberich/domain/logs.py",
    "src/kuberich/domain/log_view.py",
    "src/kuberich/domain/aggregate_logs.py",
    "src/kuberich/domain/log_json.py",
    "src/kuberich/services/sessions.py",
]
